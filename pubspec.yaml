name: vigilancia_estoica
description: Um aplicativo de vigilância diária baseado no estoicismo.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.0.0
  flutter_background_service: ^5.0.0
  flutter_tts: ^4.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  android_alarm_manager_plus: ^4.0.0
  wakelock_plus: ^1.2.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
